# ---------------------------------------------------------------------------
# Every key can be overridden with -Dkey=value on the Maven command line, or
# with an environment variable named in UPPER_SNAKE_CASE (pcloudy.api.key -> PCLOUDY_API_KEY).
# ---------------------------------------------------------------------------

# local   = Appium server on this machine (emulator or USB / adb-connected device)
# pcloudy = pCloudy cloud device
execution=pcloudy

# App under test
app.package=com.pcloudy.flightbooking
app.activity=com.pcloudy.flightbooking.ui.LoginActivity

# Waits and timeouts (seconds)
timeout.explicit.seconds=15
timeout.new.command.seconds=600

# ---------------- Local execution ----------------
appium.url=http://127.0.0.1:4723
# Leave blank to use the only connected device, or set an adb serial / tunnel address
device.udid=
device.name=Android Device
# APK is installed if missing; path is relative to this project folder
app.path=../pCloudy-Test-App_Project/app/build/outputs/apk/debug/pcloudy-demo-app.apk

# ---------------- pCloudy execution ----------------
pcloudy.hub.url=https://device.pcloudy.com/appiumcloud/wd/hub
pcloudy.username=
pcloudy.api.key=
# Name of the APK as uploaded to your pCloudy app library
pcloudy.app.name=pcloudy-demo-app.apk
pcloudy.platform.name=android
pcloudy.platform.version=15
# Device manufacturer to book, e.g. Samsung, Google, Xiaomi
pcloudy.device.manufacturer=Samsung
# Optional, e.g. GOOGLE_Pixel7_Android_14.0.0 ; leave blank to let pCloudy choose
#pcloudy.device.full.name=ONEPLUS_10T_Android_15.0.0_1a59d
pcloudy.appium.version=3.0.0
pcloudy.launch.timeout.ms=90000
pcloudy.enable.video=true
pcloudy.enable.device.logs=true
pcloudy.duration.minutes=30
# Session labels shown in pCloudy reports
pcloudy.project=New-Application
pcloudy.build=1.1
pcloudy.session.name=Anjali
pcloudy.tag=v2.0
